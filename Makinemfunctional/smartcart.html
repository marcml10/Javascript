<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Cart Arena</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .cart-card { background: #222; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 280px; }
        #cart-display { font-size: 64px; font-weight: bold; margin: 20px 0; color: #ff9900; }
        .btn-box { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; }
        button { padding: 10px 20px; font-size: 18px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; }
        .add-btn { background: #ff9900; color: #111; }
        .rem-btn { background: #444; color: #fff; }
        .clear-btn { background: transparent; color: #ff3333; border: 1px solid #ff3333; font-size: 14px; width: 100%; }
    </style>
</head>
<body>

    <div class="cart-card">
        <h3>Your Shopping Cart</h3>
        <div id="cart-display">0</div>
        
        <div class="btn-box">
            <button id="btn-remove" class="rem-btn">- Remove</button>
            <button id="btn-add" class="add-btn">+ Add Item</button>
        </div>

        <button id="btn-clear" class="clear-btn">Empty Cart</button>
    </div>

    <script>
        // TYPE EVERYTHING HERE FROM SCRATCH
        let display = document.querySelector("#cart-display");
        let removeBtn= document.querySelector("#btn-remove");
        let addBtn = document.querySelector("#btn-add");
        let clearBtn = document.querySelector("#btn-clear");
        // 1. Select your display and 3 buttons
        // 2. Set up your tracking variable
        let cartCount = 0;

        removeBtn.addEventListener("click", function(){
            if (cartCount >0) {
                let displayCount = display.textContent;
                let numDisplay = Number(displayCount);
                cartCount -=1
                display.textContent = cartCount;
                localStorage.setItem("latestCount", cartCount);
            }
        })


        addBtn.addEventListener("click", function(){
            let displayCount = display.textContent;
            let numDisplay = Number(displayCount);
            cartCount +=1
            display.textContent = cartCount;
            localStorage.setItem("latestCount", cartCount);
        })


        clearBtn.addEventListener("click", function() {
            localStorage.clear()
            cartCount=0;
            display.innerHTML = "0";

        })

        window.addEventListener("load", function() {
            let getValue = localStorage.getItem("latestCount");
            if (getValue != null){
                cartCount = Number(getValue);
                display.textContent = cartCount;
            }
            
        })
        // 3. Create your 3 event listeners (+, -, and clear)
        // 4. Create your window 'load' listener to pull from the vault
    </script>
</body>
</html>
