<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Login Practice</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 320px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            color: #666;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #007bff;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .login-btn:hover {
            background-color: #0056b3;
        }
        #message {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 id="welcome-header">Welcome Back</h2>
        
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username">
        </div>
        
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>
        
        <button class="login-btn">Log In</button>
        
        <p id="message"></p>
    </div>

    <script>
        // 🛠️ YOUR JAVASCRIPT MISSION GOES HERE! 🛠️
        
        let username=document.querySelector('#username');
        let password=document.querySelector('#password');
        let loginButton=document.querySelector('.login-btn');
        let wrongCredentials=document.querySelector('#message')

        loginButton.addEventListener('click', function(){
            let userInput=username.value;
            let passwordInput=password.value;
            if (userInput=='admin'){
                if (passwordInput==1234){
                    alert('Acess granted');
                } else {
                    wrongCredentials.textContent = "Wrong credentials";
                    wrongCredentials.style.color ="red";
                }
            } else {
                alert('Acess not granted');
            }
        }
        );
        
        // Step 2: Add a 'click' event listener to the button.
        
        // Step 3: Inside that click function, read the values of the inputs using '.value'
        
        // Step 4: Write an if/else statement! 
        // If username equals "admin" AND password equals "1234", change the #message text to "Login Successful!" and make its color green.
        // Else, change the #message text to "Invalid Credentials" and make its color red.

    </script>

</body>
</html>
