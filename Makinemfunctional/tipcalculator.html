<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 280px;
        }
        h3 { margin-top: 0; color: #333; text-align: center;}
        input {
            width: 100%;
            padding: 8px;
            margin: 10px 0 20px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .calc-btn {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .calc-btn:hover { background-color: #218838; }
        #result {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h3>Tip Calculator</h3>
        
        <label>Bill Amount ($)</label>
        <input type="number" id="bill" placeholder="e.g. 50">
        
        <label>Tip Percentage (%)</label>
        <input type="number" id="tip-percent" placeholder="e.g. 15">
        
        <button class="calc-btn">Calculate Tip</button>
        
        <p id="result">Total Tip: $0.00</p>
    </div>

    <script>
        // 🛠️ YOUR JAVASCRIPT MISSION:
        let bill = document.querySelector("#bill");
        let tipPercent = document.querySelector("#tip-percent");
        let calculate=document.querySelector(".calc-btn");
        let result=document.querySelector("#result");

        
        // 1. Select the two inputs (#bill and #tip-percent), the button, and the #result paragraph.
        
        // 2. Add a click event listener to the button.
        calculate.addEventListener("click", function(){
            let totalBill=bill.value;
            let tipInput=tipPercent.value;

        // 3. Inside the click function:
        //    - Grab the .value of the bill input.
        //    - Grab the .value of the tip input.
            tipAmount= (totalBill * tipInput) / 100;
        // 4. Do the math! 
        //    Tip Amount = (Bill * Tip Percentage) / 100;
            result.textContent = "Total tip: $" + tipAmount;
        // 5. Update the #result textContent to show the final tip!
        //    Example: result.textContent = "Total Tip: $" + calculatedTip;
        })
        

    </script>
</body>
</html>
